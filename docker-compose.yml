services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-renttrace}
      POSTGRES_USER: ${POSTGRES_USER:-renttrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project-root .env file}
    ports:
      - "5432:5432"
    volumes:
      - renttrace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-renttrace} -d ${POSTGRES_DB:-renttrace}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  renttrace_postgres_data:
